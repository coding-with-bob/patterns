oling review","ezx":"Any tool that becomes part of the checking machinery — a gate, a wrapper over gates, a choreography runner, reviewer infrastructure — gets a review by the external AI model before its first load-bearing use. If it is disputed whether a tool falls in this class, the default is that it does.","original":"*Procedure-enforced.* Any tool participating in the verification surface — a\ntier-0 gate, a wrapper over ratified gates, a choreography executor, arm\ninfrastructure — receives an external-arm review before its first\nload-bearing use; a disputed classification \"defaults to the arm\n(fail-closed)\".","gateClass":"procedure","sources":["v3/implementation/README.md §5.5 (adopted 2026-07-23)"]},{"id":"G17","type":"gate","title":"The commit-message policy hook","ezx":"A commit-message hook rejects any commit whose subject does not match the conventional type(scope): grammar. It is v1 machinery that the v3 commit stream also runs through, and the machine-enforced half of the commit-triad practice.","original":"*Machine-enforced.* `.githooks/commit-msg` runs the commit-policy validator\non every commit under the same `core.hooksPath` that carries G1; a subject\nnot matching the conventional `type(scope):` grammar is rejected\n(`src/v11/shared/commitPolicy/commitMessagePolicy.ts`) — v1 machinery the v3\ncommit stream runs through, and the machine-enforced half of M14's grammar.","gateClass":"machine","sources":[".githooks/commit-msg","src/v11/shared/commitPolicy/commitMessagePolicy.ts"]},{"id":"G18","type":"gate","title":"The tier-0 selftest armor","ezx":"The four Python checker gates first prove themselves against throwaway fixtures before running: each failure dimension must actually go red, plus one green control showing the reds are not ambient. The ADR gate's bridge carries no such self-test. A decayed selftest turns the main CI gates red.","original":"*Machine-enforced.* The four Python checker bridges chain `--selftest &&\n<run>` (`package.json`: `v3:coverage`, `v3:packet-lint`, `v3:deferred`,\n`v3:realized-map`) — the ADR bridge (`v3:adr-check`, plain bash) carries no\nselftest (2026-07-28 arm finding #6): throwaway fixtures prove \"each cross-check dimension\nactually fails red, plus one green control proving the failures are not\nambient\" — the standing mechanized floor the arm review (G16) sits on top of\n(\"selftest armor scales with the declared surface\"); a decayed selftest reds\nG1/G2.","gateClass":"machine","sources":["package.json (v3:coverage, v3:packet-lint, v3:deferred, v3:realized-map)","tools/v3-plan/check_coverage.py (docstring)","v3/implementation/README.md §5.5 (\"selftest armor scales with the declared surface\")"]},{"id":"G19","type":"gate","title":"The model↔code divergence stop","ezx":"If implementation work uncovers a bug or a gap in the design model, the loop must stop. The fix is never made quietly in the code: it goes back through the design side and returns as a regenerated machine ledger. This is a gate a human must honour — no script can detect that a discovery is model-shaped.","original":"*Procedure-enforced.* A model bug or gap surfacing during implementation is a\nmandatory stop: \"NEVER silently patched in code\" — it routes through the\nmodel plane (M8) and returns via the regenerated ledger, user-gated on the\nway. Listed as its own gate rather than only as P1's content because it is\nthe one control that can halt a running build for a reason no machine surface\ncan see: the machine gates below it police form, while this one polices where\na discovery is allowed to be fixed. Its downstream half IS machine-enforced —\nonce the model moves, G5's drift trio and G8's freshness check make the code\nside follow or go red.","gateClass":"procedure","sources":["v3/implementation/README.md §6 (\"Model↔code divergence (mandatory stop)\")"]},{"id":"G20","type":"gate","title":"The probe-runner green-baseline gate","ezx":"Before a deliberate sabotage test runs, the tool first proves the test suite was green to begin with. If the baseline is already red, the run is aborted and recorded as such, because a \"the suite went red\" receipt from an already-red suite proves nothing.","original":"*Machine-enforced.* `tools/v3-plan/probe_runner.py` opens every probe with a\nbaseline run: a non-green baseline ABORTS the probe, is recorded as its own\nreceipt class (\"baseline\": \"RED — instrument broken, receipt would be\nvacuous\"), and exits nonzero; a green baseline is recorded in the receipt.\nBorn from a measured hole rather than a worry — at ch13-P0 all 11 probes ran\nagainst an already-red baseline, so every `suite_red` receipt was vacuous.\nThe runner additionally byte-verifies restoration and treats a suite that\nstays green under mutation as a blind probe with its own exit code. It is the\ninstrument that makes M11's receipts admissible, and the clearest instance of\nP7 turned on the verification tooling itself.","gateClass":"machine","sources":["tools/v3-plan/probe_runner.py (the GREEN-BASELINE GATE docstring; the ch13-P0 measured hole)"]},{"id":"U2","type":"unclassified","title":"The Stryker mutation-testing pilot","ezx":"A mutation-testing pilot that is wired up but deliberately blocks nothing: it mutates exactly one file and appears in no hook, CI lane, or done-checklist. It runs beside the external review for two chapters until a chapter-boundary evaluation decides whether to adopt it.","original":"Wired but deliberately non-gating: it mutates exactly one file\n(`src/emit/opId.ts`) and appears in no hook, CI lane, or DoD. It ran as a\ndual-run beside arm gate-2 for two chapters, and the ch13 boundary review\n(2026-08-14) CLOSED it on its own data: **STOP** — in this setup, over nine runs, it surfaced no defect the arm had\nnot already found, against a cost of ~12m48s per run plus a maintenance\nsurface and structural subprocess blindness. The\nwiring stays; the usage lessons are recorded (whole-file scope rather than\ndelta; detector role rather than trend role; the sandbox-path abort is a\nconfiguration issue in this setup), and a revival would be \"incremental + delta +\nboundary-trend, never a per-packet gate\" (`v3/implementation/process-log.md`\nline 5790). It stays Unclassified for the same reason as before and one new\none: it can stop nothing (not a Check/Gate), no work flows through it (not a\nMechanism), and it is now a CLOSED experiment whose apparatus is deliberately\nleft in place — the taxonomy has no slot for a retired-but-wired instrument.\n\nThe stop is also the cleanest worked example of the process judging its own\nadditions: the pilot was pre-registered with a dual-run window, ran to the\nwindow's end, and was disposed against its recorded yield rather than against\nanyone's prior on mutation testing.","sources":["v3/stryker.config.json","v3/vitest.stryker.config.ts (pnpm v3:mutation)"]},{"id":"U4","type":"unclassified","title":"The autonomy trajectory (calibration → measurement → chaining)","ezx":"A declared, dated position on how far the loop is currently trusted to run alone: the calibration stage closed with a pilot chapter, the current measurement stage runs unattended work with after-the-fact audits, and a future chaining stage would deliver whole chapters through the older product-side machinery.","original":"A staged ramp with named stages: CALIBRATION closed with the ch7 pilot;\nMEASUREMENT (ch8 onward) runs autonomous flag-free packets with post-hoc\nboundary audits of the `detector_misses` stream; CHAINING is the declared\nfuture — chapter-level delivery through the v1 `ExecutePairflowPlan` and\npairflow doc-bubbles, with \"when the accounting closes\" as its stated\nconcreteness criterion. It resists the taxonomy because it is none of the\nfour types: not a timeless rule, not a procedure work flows through, not a\ndocument shape, not a control that can stop anything. It is a dated STATE —\nthe process's self-description of where on the autonomy dial it currently\nstands, and the thing every autonomy element (P3, G10, M7) is calibrated\nagainst. Listing it keeps that calibration point visible\ninstead of implicit.","sources":["v3/implementation/README.md §5.5 (\"The trajectory\")","v3/implementation/autonomy-realignment.md"]},{"id":"U3","type":"unclassified","title":"The ch11 model-sync carve-out","ezx":"A ratified one-off exception that allowed named gates to stay red at exactly one approval, with anything beyond the named list blocking. Its window has since expired, and it stays listed as the standing precedent for how a mandatory gate may lawfully be red.","original":"A ratified, one-packet-scoped amendment to gate preconditions — three named\ndrift lanes and nine enumerated coverage items were allowed red at exactly\none approve, \"any deviation beyond BLOCKS\" — whose window is now SPENT: it\nexpired at ch11-P0 build-close (ch11's contract is `realized`, and two later\nchapters have closed since), leaving the drift trio and the fold-time gate\nunconditionally binding again. It stays listed as the standing precedent for\nhow a mandatory gate may lawfully be red — an instance, not a form; a dated,\nself-expiring exception the taxonomy has no slot for.","sources":["v3/implementation/ch11-model-sync-delta.md"]}],"coreThree":[{"rank":1,"title":"The two planes must not shear","ezx":"Every other surface takes its meaning from the design model being the single semantic truth: the ledger is its machine face, packets project it, drift tests lock it. Without this principle the remaining machinery verifies nothing in particular.","itemIds":["P1"]},{"rank":2,"title":"Autonomy is proportional to contract density; the loop stops exactly where a new semantic decision is needed","ezx":"This is the constitution of who decides: the stop registry, the ratification acts, the trust dial, and the flagged-versus-flag-free split are all its projections. Losing it collapses the process into all-human ceremony or unaccountable autonomy. The 2026-08-18 run defended the STOP registry itself in this slot rather than the principle; both are kept, because the registry plus the verdict-action matrix is the one surface that carries the rule — delete it and the principle degrades to prose.","itemIds":["P3","G10"]},{"rank":3,"title":"The task packet","ezx":"The packet is where the whole process physically converges: the model's data, the plan's scope, the ratified contract anchors, the provenance manifest, and the acceptance inventories all meet in one self-contained, machine-checkable unit of work.","itemIds":["A1"]}],"edges":[{"from":"G5","to":"P1","type":"enforces","note":"the drift trio is the machine lock against shearing"},{"from":"M8","to":"P1","type":"realizes","note":"the only lawful path back to the model"},{"from":"P1","to":"P4","type":"derives-from","note":"the model as single truth is one-authority-per-fact at plane scale"},{"from":"M2","to":"P2","type":"realizes","note":"authoring as projection of the ledger slice"},{"from":"A1","to":"P2","type":"realizes","note":"the packet_rows manifest classes every row's provenance"},{"from":"G10","to":"P2","type":"enforces","note":"new-decision rows above threshold force a STOP"},{"from":"G10","to":"P3","type":"realizes","note":"the STOP registry is the practice"},{"from":"G9","to":"P3","type":"realizes","note":"the ratification act as the intent-injection point"},{"from":"M7","to":"P3","type":"realizes","note":"the entry-mode trust dial"},{"from":"M8","to":"P4","type":"realizes","note":"K0 routing to the model home"},{"from":"M9","to":"P4","type":"realizes","note":"the ADR home"},{"from":"A4","to":"P4","type":"realizes","note":"\"one authority per fact\" in the record layout"},{"from":"A6","to":"P5","type":"realizes","note":"the mandatory Verification section"},{"from":"M1","to":"P5","type":"realizes","note":"chapter 1's intake tables close the IC/PI mapping"},{"from":"A11","to":"P5","type":"realizes","note":"every invariant mapped to an enforcement class"},{"from":"G     const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = r.right + 12;
    if (left + tw > window.innerWidth - 10) left = r.left - tw - 12;
    if (left < 10) left = Math.max(10, (window.innerWidth - tw) / 2);
    const top = Math.min(Math.max(10, r.top + r.height / 2 - th / 2), Math.max(10, window.innerHeight - th - 10));
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  }
  function hideTip() {
    clearTimeout(tipTimer);
    tip.classList.remove("show");
    tipFor = null;
  }
  svg.addEventListener("mouseover", e => {
    const ic = e.target.closest(".node-info");
    if (!ic) return;
    clearTimeout(tipHideTimer);
    if (tipFor === ic.dataset.id) return;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => showTip(ic.dataset.id, ic), TIP_DELAY);
  });
  svg.addEventListener("mouseout", e => {
    if (!e.target.closest(".node-info")) return;
    clearTimeout(tipTimer);
    tipHideTimer = setTimeout(hideTip, 180);
  });
  tip.addEventListener("mouseenter", () => clearTimeout(tipHideTimer));
  tip.addEventListener("mouseleave", () => { tipHideTimer = setTimeout(hideTip, 120); });

  svg.addEventListener("click", e => {
    const ic = e.target.closest(".node-info");
    const g = e.target.closest(".node");
    if (ic) { clearTimeout(tipTimer); showTip(ic.dataset.id, ic); }
    if (g) selectNode(g.dataset.id); else clearSel();
  });
  svg.addEventListener("keydown", e => {
    const g = e.target.closest(".node");
    if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); selectNode(g.dataset.id); }
  });

  /* ---- edge-type toggles ---- */
  const usedTypes = [...new Set(edges.map(e => e.type))];
  const toggles = usedTypes.map(t => {
    const st = EDGE_STYLES[t];
    const sample = s("svg", { width: 26, height: 8, "aria-hidden": "true" },
      s("path", { d: "M1 4 H25", stroke: "currentColor", "stroke-width": st.width, "stroke-dasharray": st.dash || "none", fill: "none" }));
    return h("button", { class: "edge-toggle", "aria-pressed": "true", onclick: ev => {
      const btn = ev.currentTarget;
      const on = btn.getAttribute("aria-pressed") !== "true";
      btn.setAttribute("aria-pressed", String(on));
      if (on) hiddenTypes.delete(t); else hiddenTypes.add(t);
      clearSel();
      render();
    } }, sample, st.label, " (" + edges.filter(e => e.type === t).length + ")");
  });

  /* ---- expand / collapse ---- */
  function cornerIcon(collapse) {
    const d = collapse
      ? "M9 3v6H3 M15 3v6h6 M15 21v-6h6 M9 21v-6H3"
      : "M3 9V3h6 M15 3h6v6 M21 15v6h-6 M9 21H3v-6";
    return s("svg", { width: 15, height: 15, viewBox: "0 0 24 24", fill: "none", "aria-hidden": "true" },
      s("path", { d, stroke: "currentColor", "stroke-width": "2", "stroke-linecap": "round", "stroke-linejoin": "round" }));
  }
  const expandBtn = h("button", { class: "map-expand", type: "button", "aria-label": "Expand the map", title: "Expand the map" }, cornerIcon(false));
  const scrollBox = h("div", { class: "map-scroll" }, svg);
  const mapBox = h("div", { class: "map-box" }, expandBtn, scrollBox);
  const mapWrap = h("div", { class: "map-wrap" },
    h("div", { class: "map-controls" }, toggles, h("span", { class: "map-hint" }, "click a node · hover ⓘ for the description · Esc to clear")),
    mapBox, info);
  const backdrop = h("div", { class: "map-backdrop", onclick: () => setExpanded(false) });

  function geoFor(boxW) {
    const avail = Math.max(360, boxW - 22);
    const gapMin = 70;
    const fitW = Math.floor((avail - PAD * 2 - (cols.length - 1) * gapMin) / cols.length);
    const nodeW = Math.max(COMPACT.nodeW, Math.min(fitW, Math.ceil(TITLE_X + TITLE_W_MAX + INFO_W + 10)));
    const gap = Math.max(gapMin, Math.min(240, Math.floor((avail - PAD * 2 - cols.length * nodeW) / (cols.length - 1))));
    return { nodeW, colGap: gap, wrap: true };
  }
  function relayout() {
    if (!expanded) { geo = COMPACT; render(); return; }
    const boxW = scrollBox.clientWidth;
    geo = geoFor(boxW);
    render();
    /* a scrollbar may have appeared during that render — re-fit once against the real width */
    if (scrollBox.clientWidth !== boxW) { geo = geoFor(scrollBox.clientWidth); render(); }
  }
  function setExpanded(on) {
    if (expanded === on) return;
    expanded = on;
    hideTip();
    mapWrap.classList.toggle("expanded", on);
    backdrop.classList.toggle("show", on);
    document.body.classList.toggle("map-open", on);
    expandBtn.replaceChildren(cornerIcon(on));
    expandBtn.setAttribute("aria-label", on ? "Collapse the map" : "Expand the map");
    expandBtn.setAttribute("title", on ? "Collapse the map (Esc)" : "Expand the map");
    requestAnimationFrame(relayout);
  }
  expandBtn.addEventListener("click", () => setExpanded(!expanded));
  scrollBox.addEventListener("scroll", hideTip);
  window.addEventListener("scroll", hideTip, { passive: true });
  let resizeTimer = null;
  window.addEventListener("resize", () => {
    if (!expanded) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(relayout, 120);
  });
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (tipFor) hideTip();
    else if (selected) clearSel();
    else if (expanded) setExpanded(false);
  });

  render();
  app.append(h("section", { id: "map-sec", class: "wrap" },
    h("h2", null, "How the pieces hold each other"),
    h("p", { class: "sec-desc" }, "Every line is a relation the report states explicitly. Gates enforce principles; procedures nest inside the main loop. Click an element to see what it is connected to — or expand the map for full titles."),
    mapWrap, backdrop));
}

/* ---------- item sections ---------- */
function relLine(verb, otherId) {
  const other = byId.get(otherId);
  return h("div", { class: "rel" },
    h("span", { class: "verb" }, verb + " "),
    h("a", { href: "#card-" + otherId, onclick: e => { e.preventDefault(); openCard(otherId); } },
      otherId + (other ? " — " + other.title : "")));
}
function itemCard(it) {
  const orig = h("div", { class: "orig" });
  orig.innerHTML = md(it.original);
  const rels = [
    ...(outEdges.get(it.id) || []).map(e => relLine(EDGE_VERBS[e.type][0], e.to)),
    ...(inEdges.get(it.id) || []).map(e => relLine(EDGE_VERBS[e.type][1], e.from))
  ];
  const ezx = h("p", { class: "ezx" }); ezx.innerHTML = md(it.ezx);
  return h("article", { class: "card", id: "card-" + it.id, "data-search": (it.id + " " + it.title + " " + it.ezx).toLowerCase() },
    h("div", { class: "card-head" },
      h("span", { class: "chip", style: "--cc:" + TYPES[it.type].css }, it.id),
      h("span", { class: "title" }, it.title),
      it.gateClass ? h("span", { class: "tag" }, it.gateClass + "-enforced") : null,
      (it.flags || []).map(f => h("span", { class: "tag" }, f))),
    ezx,
    h("details", null,
      h("summary", null, "Original text & sources"),
      orig,
      (it.sources || []).length ? h("ul", { class: "srcs" }, it.sources.map(src => h("li", null, src))) : null,
      rels.length ? h("div", { class: "rels" }, rels) : null));
}
for (const t of TILE_ORDER) {
  const items = DATA.items.filter(it => it.type === t);
  if (!items.length) continue;
  app.append(h("section", { id: "sec-" + t, class: "wrap" },
    h("h2", { style: "--hc:" + TYPES[t].css },
      h("span", { class: "dot", "aria-hidden": "true" }),
      TYPES[t].label,
      h("span", { class: "cnt" }, String(items.length))),
    h("p", { class: "sec-desc" }, TYPES[t].desc),
    h("div", { class: "card-grid" }, items.map(itemCard))));
}

/* ---------- retired ---------- */
if ((DATA.retired || []).length) {
  app.append(h("section", { id: "retired", class: "wrap" },
    h("h2", null, "Superseded along the way"),
    h("p", { class: "sec-desc" }, "The process retires its own rules with the same care it births them. What was replaced, and by what."),
    h("div", { class: "retired-list" },
      DATA.retired.map(r => h("div", { class: "retired-row" },
        h("span", { class: "old" }, r.old),
        h("span", { class: "arrow", "aria-hidden": "true" }, "→"),
        h("span", { class: "new" }, r.new),
        r.note ? h("span", { class: "note" }, r.note) : null)))));
}

/* ---------- verification ---------- */
if (DATA.verification) {
  const v = DATA.verification;
  app.append(h("section", { id: "verif", class: "wrap" },
    h("h2", null, "External verification"),
    h("p", { class: "sec-desc" },
      "A different vendor's model (" + v.arm + ") reviewed this report against the repository. Findings and their recorded dispositions:"),
    h("div", { class: "verif-head" }, h("span", { class: "verif-file" }, v.findingsFile)),
    h("div", null, v.findings.map(f =>
      h("div", { class: "finding" },
        h("span", { class: "disp", "data-d": f.disposition }, f.disposition),
        h("span", null, f.summary,
          (f.itemIds || []).length ? h("span", { class: "fchips" }, f.itemIds.map(id => chip(id))) : null))))));
}

/* ---------- footer ---------- */
app.append(h("footer", null, h("div", { class: "wrap" },
  h("div", { class: "prov" }, "Source: " + (DATA.sourcePath || "raw/_cross/self-reports/" + DATA.reportFile) + " · rendered " + DATA.generatedAt),
  h("div", null, "Descriptive only, like the report itself: the form is changed, the content is not."))));

/* ---------- text filter ---------- */
$("#q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".card").forEach(c => {
    c.style.display = !q || c.dataset.search.includes(q) ? "" : "none";
  });
});
</script>

</body>
</html>
