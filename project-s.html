il may be written about it, and reviewers are not allowed to demand completeness of invented material.","original":"Every contract row carries a label (`field-validated | literature |\nnotes-derived | invented`) plus a revisit trigger where not field-validated;\nprotocol depth is allowed only for day-one AND ≥ notes-derived slices;\nmechanism-completeness findings against `invented` material are declined by\nrule. Lives in `model/PROCESS2.md` core principle #2 (with concept-first\nphasing as principle #3 applying it in time).","sources":["model/PROCESS2.md core principle #2","model/PROCESS2.md core principle #3"]},{"id":"P5","type":"principle","title":"Teachability is a gate co-equal with correctness","ezx":"A document that is technically right but impossible to learn from fails its review, exactly as a wrong one would. A reader who has never seen the material must understand it before anything is accepted — this is never postponed as debt.","original":"An artifact that is right but unlearnable fails its gate; a fresh-reader check\nis part of every level's acceptance — and, on the tour track, of every\nchapter's — not deferred debt (\"Something in the loop must subtract and\nsomething must teach; cycle 1 had only the owner for both\"). Lives in\n`model/PROCESS2.md` core principle #5 and the fresh-reader bullet of the\nreview regime.","sources":["model/PROCESS2.md core principle #5","model/PROCESS2.md §Review regime (fresh-reader bullet)"]},{"id":"P6","type":"principle","title":"A verdict that does not cite the basis is no verdict","ezx":"When an outside reviewer passes judgment, it must name exactly which bytes it looked at: a fixed model, a clean checkout, and file fingerprints taken before and after. A verdict without those references does not count as one.","original":"External review binds to exact bytes: pinned model, clean tree, byte-guard\nbefore/after, hash-citing verdicts. Lives in `model/PROCESS2.md` §Review\nregime (kept unchanged from cycle 1, `model-c1/PROCESS.md`).","sources":["model/PROCESS2.md §Review regime","model-c1/PROCESS.md"]},{"id":"P7","type":"principle","title":"The reviewer is not a co-author","ezx":"Every point a reviewer raises gets an explicit written answer. If the team agrees with absolutely everything the reviewer said, that is treated as a warning sign about the triage, not as proof of quality.","original":"Every finding gets an explicit disposition, and total agreement is itself a\ndefect signal: \"a round with a 100% fold rate is itself a signal to inspect\nthe triage, not a sign of quality\" (`model/PROCESS2.md` §Review regime).\nEvidence base: \"an adversarial reviewer with a 100% acceptance rate is a\nratchet, not a filter\" (`model-c1/retro/2026-07-13-reset-decision.md`).","sources":["model/PROCESS2.md §Review regime","model-c1/retro/2026-07-13-reset-decision.md"]},{"id":"P8","type":"principle","title":"Judgment-laden checks give feedback, never rails; owner judgment prevails","ezx":"Where an automated check touches a matter of judgment — reading pace, file size, how many concepts fit in a level — it may only warn and open a discussion; it never decides. Breaking such a quality bar on purpose is legitimate as long as it is recorded as one line of acknowledged debt. Checks about mechanical integrity remain hard blocks.","original":"Where a check touches a judgment call (reading cadence, sizing, concept\nbudgets), automation warns and opens a discussion, never decides; a deliberate\nquality-bar break is legitimate if recorded as one-line acknowledged debt in\nthe gate record. The principle is scoped to these guards —\nmechanical-integrity checks (G1–G7) are hard rails by design. Lives in\n`model/PROCESS2.md` settled decision #4 (cadence guard: \"a feedback mechanism,\nnever a rail\") and the size-trigger bullet of the review regime (\"mandatory\ncheck, advisory outcome\"), whose operating mode decision #6 fixes.","sources":["model/PROCESS2.md settled decision #4","model/PROCESS2.md §Review regime (size-trigger bullet)","model/PROCESS2.md decision #6"]},{"id":"P9","type":"principle","title":"Owner ratification is the single identity-bound act — never delegated","ezx":"Anyone, and any session, may do the work. Only the owner can declare something accepted, and that one act is tied to a specific person and never handed off.","original":"Everything else is executable by any session; acceptance is not. Lives in\n`model/STRUCTURE.md` §Operational layer; carried from the pairflow rule per\n`model/PROCESS2.md` decision #2f.","sources":["model/STRUCTURE.md §Operational layer","model/PROCESS2.md decision #2f"]},{"id":"P10","type":"principle","title":"The current version speaks in the present","ezx":"Documents say what is true right now, written for someone who never saw an earlier draft. The history of edits belongs in git, in the commit message, or in the amendment registry — with two allowed exceptions: recorded decisions whose alternatives are still relevant, and dates during a live switchover.","original":"Text states what is true now, for a reader who never saw an earlier version;\nedit scars belong in git, the commit message, or the amendment registry — with\ntwo sanctioned exceptions (DECISION blocks with still-relevant alternatives;\ninline dates at a live cutover). Lives in `model/PROCESS2.md` core principle\n#8.","sources":["model/PROCESS2.md core principle #8"]},{"id":"P11","type":"principle","title":"Invariants-vs-tooling: build only what the next phase consumes; deliberate absences carry revisit triggers","ezx":"Nothing gets built until the very next phase actually needs it. Choosing not to build something is itself a recorded decision, and it must name the condition that would make the team reconsider.","original":"Not-doing is a first-class recorded decision with a firing condition. Lives in\n`model/PROCESS2.md` core principle #7; process-side instance: \"Deliberately\nnot built: a repo inbox for the design dialogue… Revisit trigger: manual\ntransport proves a burden\" (`model/STRUCTURE.md` §Operational layer);\nmodel-side form: the absence ledger in `model/invariants.md`.","sources":["model/PROCESS2.md core principle #7","model/STRUCTURE.md §Operational layer","model/invariants.md"]},{"id":"P12","type":"principle","title":"Nothing is silently dropped; inclusion is a decision, not a default","ezx":"Every obligation either gets a destination or is explicitly parked on the record — none may just vanish. When the corpus was restarted, everything was moved out and pulled back one piece at a time under review, so a forgotten item shows up as a loud missing file instead of quietly riding along.","original":"Every obligation is mapped or explicitly parked (\"Completeness rule: every\nitem has at least one destination; nothing is silently dropped\",\n`model/traceability.md`), and a corpus reset moves everything out and pulls\nliving assets back one by one under review (\"the failure mode inverts from\nsilent carry-over to loud missing-file\", `model/PROCESS2.md` decision #2c).","sources":["model/traceability.md","model/PROCESS2.md decision #2c"]},{"id":"P13","type":"principle","title":"The model is the truth; narrative is derivative","ezx":"The guided tour explains the architecture in simpler words but never becomes a second source of truth. A tour sentence that contradicts the model is a tour bug — unless the owner rules that the model is the thing that is wrong, which sends the work back into the model.","original":"The tour simplifies but never becomes a second authority; a tour statement\ncontradicting the model is a tour bug unless the owner rules it a model\nfinding, which then routes as a backtrack. Lives in\n`model/onboarding/onboarding-process.md` (Position paragraph and method step\n4), carried from `model-c1/PROCESS.md` core idea 6.","sources":["model/onboarding/onboarding-process.md (Position paragraph, method step 4)","model-c1/PROCESS.md core idea 6"]},{"id":"P14","type":"principle","title":"Comprehension is measured, never recall; the instrument is blind","ezx":"Tests check whether a reader actually understood, not whether they can repeat wording. The test reader is deliberately kept away from the notes and from the expected answers, and questions are written so that copying phrases out of the document does not produce a correct answer.","original":"Validation instruments are deliberately deprived of the inputs that would let\nthem pattern-match: the fresh-reader arm is notes-blind with pass markers\nwithheld; questions \"must NOT be answerable by pattern-matching [the\nartifact's] wording\". Lives in `model/spine/question-bank/README.md` (writing\nprinciple) and `model/PROCESS2.md` (fresh-reader and domain-arm bullets).\nDerives from P5: it is what makes teachability gate-able.","sources":["model/spine/question-bank/README.md","model/PROCESS2.md (fresh-reader and domain-arm bullets)"]},{"id":"P15","type":"principle","title":"The model is a conversation basis and sizing instrument first, an implementation spec only where validated","ezx":"The corpus exists first to make good conversations possible and to give an honest estimate of size and effort. It counts as a build specification only in the places that have actually been validated.","original":"\"The MVP-cut is a column in the contract tables (`day-one | contract-later |\ndeferred-capability | awaiting-validation`), not a retro\"; R1's declared end\ndeliverable is \"the conversation basis + the first honest sizing\". Lives in\n`model/PROCESS2.md` core principle #4 and §Phases R1; carried into every `mvp`\ncolumn (A1), the debt map's seed store (A12), the ledger's MVP-cut view (A14),\nand the tour's rule that it \"simplifies only along the MVP-cut axis\"\n(`model/onboarding/onboarding-process.md`). *(Rank note: added in the\nverification round; by load it belongs beside P4, not at the tail.)*","sources":["model/PROCESS2.md core principle #4","model/PROCESS2.md §Phases R1","model/onboarding/onboarding-process.md"]},{"id":"M1","type":"mechanism","title":"The external review-arm regime","ezx":"Cycle-2 documents are hardened by fresh outside AI sessions run against a committed snapshot: one plays the hostile fault-finder, one plays a first-time reader answering quiz questions, and a third — a production-engineer persona, not yet run — checks real-world plausibility. Not literally every c2 file went through it: the debt map was owner-accepted without a review round of its own. The flow is fixed: commit, fingerprint the bytes, run the reviewer, get a verdict citing those fingerprints, decide each point, commit the fixes as one round.","original":"C2 artifacts are hardened by fresh external LLM sessions run against a\ncommitted tree: a falsifier (a pinned external reviewer model, offline,\nadversarial), a fresh-reader lens (notes-blind, answers question-bank\nquestions), and an experimental domain-plausibility arm (production-engineer\npersona, web-grounded, output routed as questions to the domain-expert agenda, never\nfolded directly; not yet run). Not universal in practice: the c2 debt map\n(`model/c2/debt-map.md`, `track: c2`) was owner-accepted with no arm round of\nits own — the five recorded rounds cover `concept.md` and `S13.md` (2026-07-27\narm finding #1). Work flows: clean-tree commit → byte-guard → arm run →\nhash-citing verdict → triage → folds committed as one round. Defined in\n`model/PROCESS2.md` §Review regime and decision #5; practiced in the five\nround records of `model/c2/L0/_meta.md`.","sources":["model/PROCESS2.md §Review regime","model/PROCESS2.md decision #5","model/c2/L0/_meta.md"]},{"id":"M2","type":"mechanism","title":"Finding-disposition triage","ezx":"Each point a reviewer raises gets exactly one verdict — folded in, narrowed, declined, or deferred — with one line of reasoning. What even counts as a valid point depends on the document's genre: an explanatory piece may only be challenged on concepts, a rules table on precision.","original":"Every finding gets exactly one verdict (`folded | narrowed | declined |\ndeferred-to-ADR | deferred-to-validation`) with one line of why; what counts\nas a finding is scoped per genre (concept → conceptual only; contracts →\nprecision; protocols → mechanism); implementation-plane findings are\ndeferred-to-ADR from round 1. Defined in `model/PROCESS2.md` §Review regime;\npracticed in the disposition tables of `model/c2/L0/_meta.md`.","sources":["model/PROCESS2.md §Review regime","model/c2/L0/_meta.md"]},{"id":"M3","type":"mechanism","title":"Phased corpus passes R0 → R1 → R2 → R3 → C2","ezx":"The whole corpus climbs in stages together: everything reaches the explanatory level before any part gets exact rules, and step-by-step detail is written only for pieces needed on day one that are also reasonably grounded. Each explanatory unit follows a fixed recipe — open with a real story, one summary table, a shared worked example, and labelled draft rules.","original":"The whole corpus reaches concept level (R1) before any slice reaches contract\n(R2) or protocol depth (R3, only day-one ∧ ≥ notes-derived, quarrying cycle-1\nby traceability slice); C2 assembles. Per level the R1 unit is the concept\nartifact: trace-first opening from a scenario-ledger story, one-table summary,\ntranscluded worked example, contract sketches with labels and `mvp` values\nconsuming debt-map seeds. Defined in `model/PROCESS2.md` §Phases; first full\ninstance `model/c2/L0/`.","sources":["model/PROCESS2.md §Phases","model/c2/L0/"]},{"id":"M4","type":"mechanism","title":"The identity-free operational layer","ezx":"There are two work tracks, each with its own process file, its own directories, and its own checkpoints. A session takes on a track by reading a fixed set of starter documents and then labels its commits with that track's prefix. Writing into the other track's area means running that track's checkpoint and logging it there, all inside one commit.","original":"Two tracks (c2, tour), each = process file + owned directories + gate\nprocedures; a session assumes a role via the mandatory bootstrap read (own\nprocess file + changelog tail + charter) and declares it in the commit prefix\n(`c2:` / `tour:`); a gate = trigger + procedure + required evidence in the\nfolding commit; cross-track writes run the target track's gate, log in the\ntarget track's changelog, and are commit-atomic. Defined in\n`model/STRUCTURE.md` §Operational layer; practiced in the four \"cross-track\nnote from the c2 track\" entries of `model/onboarding/onboarding-process.md`.","sources":["model/STRUCTURE.md §Operational layer","model/onboarding/onboarding-process.md"]},{"id":"M5","type":"mechanism","title":"The validation plane: labels → one assumption register → the domain-expert agenda","ezx":"Everything the team is unsure about flows into a single generated list of assumptions, fed from three places, each entry carrying the condition that would trigger a revisit. A curated top ten becomes the agenda for the domain expert — one question list, never three parallel ones.","original":"Epistemic labels and the DA register share one namespace (live span DA-1..41 —\nDA-40/41 were minted at the Ch6 owner read, `model/spine/concept-inventory.md`\n§5 and changelog; `model/PROCESS2.md` and `model/ledger.md` still say\n\"DA-1..39\", stale repo text); the generated assumption register has three\nfeeders (DA assertions, non-validated contract rows, open domain-arm\nquestions), each entry with a revisit trigger; a curated top-10 becomes the\ndomain expert's agenda, served through the scenario ledger and the\ntour's validation blocks (\"one agenda, never three parallel question lists\").\nA data track (a vendor telemetry sheet + synthetic fixture) is defined but has\nno artifact on disk yet. Defined in `model/PROCESS2.md` §Validation plane; DA\nregister at `model/spine/concept-inventory.md` §5.","sources":["model/PROCESS2.md §Validation plane","model/spine/concept-inventory.md §5"]},{"id":"M6","type":"mechanism","title":"The build pipeline: one source → one page, write-once → render-twice","ezx":"A small dependency-free build turns every markdown page into a committed HTML sibling with a navigation strip and hover cards, pulls shared pieces into more than one page from a single source file, and regenerates the corpus ledger.","original":"`npm run build` (`scripts/build.mjs`, zero-dependency, hand-rolled md renderer\n`scripts/md-render.mjs`) renders every page source on the live surface (c2 +\ntour) to a committed `.html` sibling with a nav strip and hover-card block\n(INV/ABS/S/DA ids via `scripts/id-registry.mjs`; glossary lines via\n`scripts/vocab-lib.mjs`), resolves `<!-- transclude: … -->` markers (the\nshared example and the loop map inlined into both a level page and a tour\nchapter), and regenerates `model/ledger.md` (`scripts/ledger.mjs`). Settled in\n`model/PROCESS2.md` decisions #1, #2g, #7.","sources":["model/PROCESS2.md decisions #1, #2g, #7","scripts/build.mjs","scripts/md-render.mjs","scripts/id-registry.mjs","scripts/vocab-lib.mjs","scripts/ledger.mjs"]},{"id":"M7","type":"mechanism","title":"Debt-coverage mapping","ezx":"Every live obligation left over from the frozen first cycle is mapped to exactly one fate — feed the MVP cut, decline, hand to the tour, or park. A parked item whose trigger fires is re-decided on the spot, so the map always describes the present and never keeps instructing an action already done.","original":"Every live obligation of the frozen cycle-1 quarry (6 PC0 items, 63 frozen-§9\nitems, 4 topic memos) is mapped to exactly one cycle-2 fate from a typed\ndisposition set (`mvp-cut-seed / declined(…) / tour / parked`); a fired\n`parked` trigger re-dispositions its row in the folding commit — \"the map\nspeaks in the present and never keeps instructing an action already done\".\nLives in `model/c2/debt-map.md`; mandated by `model/PROCESS2.md` (R0 step 5).","sources":["model/c2/debt-map.md","model/PROCESS2.md (R0 step 5)"]},{"id":"M8","type":"mechanism","title":"The tour per-chapter loop","ezx":"Each tour chapter runs the same loop: seed the quiz questions, draft the chapter in three depth tiers with a validation block at the end, test it on a reader kept away from the notes, have the owner review it, accept, commit. Standing guards send model contradictions back as tour bugs or model backtracks.","original":"Question bank seeded for the chapter's concepts → draft from the inventory\n(core / in-passing / under-the-hood tiers + persona-tagged validation block\nordered non-field-validated-first) → notes-blind fresh-reader test on the\nshared bank → Felho review checkpoint → accept → commit; standing guards route\nmodel contradictions back as tour bugs or backtracks. Defined in\n`model/onboarding/onboarding-process.md` §Method; practiced across all ten\nchapters (each Progress row records its fresh-reader score, 3/3 … 18/18). The\nstrict *seed-before-draft* ordering is visible in eight of ten chapters'\nchangelog entries (\"Question bank seeded first per the minting rule\", Ch2–Ch9;\nCh0/Ch1 were seeded in one earlier R0-step-5 commit) and holds in commit order\nfor all ten, but is not stated as a rule in the method steps or the bank\nREADME — **practiced, not recorded**.","sources":["model/onboarding/onboarding-process.md §Method","model/onboarding/tour/ch0…ch9"],"flags":["practiced, not recorded"]},{"id":"M9","type":"mechanism","title":"Changelog-and-commit telemetry as institutional memory","ezx":"Every process file keeps a dated changelog recording what changed, why, on whose prompt, and what was deliberately left alone; each review round is one commit whose subject carries the round's tally. The recurring shape of those commit bodies is real practice — though not universal — and is nowhere written down as a requirement.","original":"Every process file carries a dated, reasoning-dense changelog (what changed,\nwhy, on whose trigger, what was deliberately not changed); each arm round is\none commit whose subject carries the round tally; in the c2 arm-round era the\ncommit bodies follow a recurring shape — `Trigger:` opener, disposition\nbullets, a `Checks:` footer (e.g. \"Checks: 0 errors, 4 pre-existing warnings.\"\nin `5a87516`; wording varies across the 12 commits that carry one, only 24 of\nthe 62 track-prefixed commits open with `Trigger:`, and the INV-R7 cross-track\nfold commit `3e77f39` carries no `Checks:` footer at all — 2026-07-27 arm\nfinding #4). The content requirement (\"trigger citation, checklist, affected\nIDs\") is written in `model/STRUCTURE.md` §Operational layer and\n\"commit-per-round telemetry in the changelog\" in `model/PROCESS2.md` §Review\nregime; the commit-body shape, the subject-line telemetry grammar, and the\nrule that changelog entries carry rationale and no-change rulings are\n**practiced, not recorded** (visible in `git log`, e.g. commits `f8b9edf`,\n`5a87516`).","sources":["model/STRUCTURE.md §Operational layer","model/PROCESS2.md §Review regime","git log (f8b9edf, 5a87516)"],"flags":["practiced, not recorded"]},{"id":"M10","type":"mechanism","title":"Deliberate-pull migration","ezx":"To restart the corpus, the whole tree was renamed to a sibling folder, an empty tree was created from the charter, and each still-living asset was pulled back one at a time under review — trimmed during the pull — with an inventory recorded in the move commit.","original":"The reset procedure: rename the whole tree to a sibling (`git mv model/ →\nmodel-c1/`), create an empty tree per the charter, pull each living asset back\none by one under review (vocabulary slimmed *during* its pull), record a pull\ninventory in the move commit and work a path-consumer checklist. Defined in\n`model/PROCESS2.md` decision #2c/#2d; executed per the 2026-07-13 changelog\nentries (steps 2–3).","sources":["model/PROCESS2.md decision #2c/#2d","model/PROCESS2.md changelog 2026-07-13 (steps 2–3)"]},{"id":"M11","type":"mechanism","title":"The reference-consistency worklist","ezx":"One command prints every place an identifier appears across the whole live document tree. That listing is the mechanical to-do list whenever something is renamed or a level is split.","original":"Heading anchors `{#id}` join the checked id namespace; `npm run where -- <id>`\n(`scripts/where.mjs`, generalized from `scripts/vocab-where.mjs`) prints every\noccurrence across the whole live `model/` markdown tree (foundation, c2,\nspine, tour; generated ledger excluded) as the mechanical rewrite worklist for\nrenames and future level splits. Settled in `model/PROCESS2.md` decision #3.","sources":["model/PROCESS2.md decision #3","scripts/where.mjs"]},{"id":"M13","type":"mechanism","title":"Basis-register pin-and-re-verify","ezx":"Documents list the exact sources they were built on. The strict form — pinned to a specific commit or marked frozen or read-for-non-contradiction, re-checked at acceptance — lives in the cycle-2 track's basis register; tour chapters name their sources without pins. This is what makes parallel work by throwaway sessions safe.","original":"Consuming artifacts pin their sources at a commit (`@ 4fa44f0`), or as `frozen\n(quarry)` / `read for non-contradiction`, and re-verify the pins at acceptance\n— the mechanism that makes parallel-track work safe across ephemeral sessions\n(cycle 1's retro called it \"the standout process innovation\",\n`model-c1/retro/2026-07-13-report-1-process.md`). Kept in `model/PROCESS2.md`\n§Corpus structure (\"basis registers (§1.1 @commit + ⚠ re-verify) for parallel\ntracks\"); the full pinned form is live in `model/c2/L0/_meta.md` §Basis\nregister only — tour chapters' front-matter `basis:` strings cite paths,\nsections, and IDs but carry no commit pins or frozen/read-for markers\n(2026-07-27 arm finding #2).","sources":["model/PROCESS2.md §Corpus structure","model/c2/L0/_meta.md §Basis register","model/onboarding/tour/ch*.md front-matter `basis:`"]},{"id":"M14","type":"mechanism","title":"One-carrier routing of open questions","ezx":"A live open question is carried by one document; wherever else it surfaces it is declined as a duplicate that cites the carrier. One deliberate two-carrier exception is on record, and as a general rule the routing is written down only for the debt map.","original":"A live open question gets one carrier artifact; duplicates are declined citing\nit (the DA-6 reading question: carried by the L1 forward flag in\n`model/c2/L0/_meta.md`, declined as duplicate in arm rounds 3 and 5, surfaced\non the bootstrap read path via the PROCESS2 Progress row). One deliberate\nexception is recorded: the consent question is \"one question, two flags\",\ncarried by DEBT-L5-8 *and* DEBT-L6-2 (`model/c2/debt-map.md`, 2026-07-27 arm\nfinding #3). Partly recorded as debt-map disposition tokens (\"one carrier,\nnever two\", `model/c2/debt-map.md` §Dispositions); as a general routing rule\nit is **practiced, not recorded**.","sources":["model/c2/L0/_meta.md","model/c2/debt-map.md §Dispositions"],"flags":["practiced, not recorded"]},{"id":"M15","type":"mechanism","title":"The team validation round (domain / commercial / product lenses)","ezx":"Once enough tour chapters exist, three colleagues each read a different slice — the domain expert the assumption register, the commercial lead the trust and network story, the product lead the MVP path — and their answers fold back as tour edits, model corrections, or scope items. This is the only surface that puts the corpus in front of humans other than the owner, and it has not started.","original":"The tour track's declared purpose: after Ch0–Ch5 exist (threshold reached),\nthe domain expert reads the DA register through the chapter-end blocks, the\ncommercial lens the trust/network narrative (Ch1/Ch7/Ch9), the product lens\nthe MVP-path visibility (Ch5/Ch8);\nanswers fold back three ways — tour edits (presentation), model backtracks\n(substance), PC0 ledger items (scope). Defined in\n`model/onboarding/onboarding-process.md` §Validation round; the process's only\nsurface that puts the corpus before humans other than the owner — currently\n`todo`.","sources":["model/onboarding/onboarding-process.md §Validation round"],"flags":["currently todo"]},{"id":"A1","type":"artifact","title":"Level genre files: `concept.md` / `contracts.md` / `protocols/<name>.md`","ezx":"Each architecture level is written across three file kinds: one that explains the idea, one that lists exact rules in tables, and one per step-by-step procedure. Only the explanatory file exists so far; the other two slots are specified and reserved.","original":"One altitude per file: concept = trace-first opening + one-table summary +\nworked example + labeled contract sketches; contracts = normative tables with\n`label` and `mvp` columns + DECISION blocks; protocols = one protocol per\nfile, pseudocode, only where earned. Instantiated: `model/c2/L0/concept.md`\n(front matter `level/genre/status/basis`); contracts and protocols are\nspecified-but-uninstantiated (form in `model/PROCESS2.md` principle #1 and\ndecision #1; the rendered nav already reserves the slot — `<span\nclass=\"disabled\">contracts</span>` in `model/c2/L0/concept.html`).","sources":["model/c2/L0/concept.md","model/PROCESS2.md principle #1","model/PROCESS2.md decision #1","model/c2/L0/concept.html"],"flags":["contracts & protocols: specified-but-uninstantiated"]},{"id":"A2","type":"artifact","title":"The level process sidecar `_meta.md`","ezx":"A side file per level holds all the bookkeeping: which sources it was built on and at which commit, which debt items it consumed, what each review round found and how each finding was decided, the stopping-rule record, and the acceptance record. It is deliberately kept off the reading path.","original":"Basis register (`Source | Pin | Role`, pins `@ <commit>` / `frozen (quarry)` /\n`read for non-contradiction`), debt seeds consumed, per-round arm records\n(pin, byte-guard hashes, findings table with dispositions), stopping-rule\nrecord, gate record, scenario-expressibility table, owner decisions — \"not\npart of the reading path\". Instance: `model/c2/L0/_meta.md`; rendered set\napart (`_meta.html`, `body.meta-page` with a \"Process record — nav-only\"\nbanner).","sources":["model/c2/L0/_meta.md","model/c2/L0/_meta.html"]},{"id":"A3","type":"artifact","title":"The track process file","ezx":"Each track has one file that is both its constitution and its running record: a status header, numbered principles or method steps, settled decisions, a progress table with a declared status lifecycle, and a dated changelog.","original":"A track's constitution and running record in one: a status header (`Status /\nDate` plus, per instance, `Supersedes / Basis` on PROCESS2 or `Purpose /\nPosition` on the tour file), numbered principles or method steps, settled\ndecisions, a Progress table (the status lifecycle `todo → in progress → in\nreview → accepted (+ reopened)` is declared in PROCESS2 and reused by the\ntour), and a dated changelog. Instances: `model/PROCESS2.md`,\n`model/onboarding/onboarding-process.md`, and the frozen `model-c1/PROCESS.md`\n(which the PROCESS2 instance explicitly supersedes).","sources":["model/PROCESS2.md","model/onboarding/onboarding-process.md","model-c1/PROCESS.md"]},{"id":"A4","type":"artifact","title":"The structure charter","ezx":"One file is the single authority for where things live, who may write them, and how they may change: a placement rule, a layout table, an ownership table, the operational layer, and its own changelog.","original":"The single authority for layout, ownership, and change rules: placement rule,\nlayout table, ownership table (`Path | Writes | Reads | Change rule`),\noperational layer, own changelog. Instance: `model/STRUCTURE.md` (\"Process\nfiles describe only their own consumption of shared assets — never their\nlocation, ownership, or content rules\").","sources":["model/STRUCTURE.md"]},{"id":"A5","type":"artifact","title":"Invariant catalog & absence ledger","ezx":"One file lists the architecture's fixed truths, each with an ID, title, body, and a citation to its design source. Beside them sit the deliberate absences, each carrying a reason and a mandatory condition for revisiting it.","original":"One bolded ID + title + body + design-source citation per invariant\n(`INV-D/K/R/T` families); absences (`ABS-*`) each carry *Why* and a mandatory\n*Revisit* trigger; a Gate-usage footer defines how levels cite them. Instance:\n`model/invariants.md` (25 INV + 7 ABS).","sources":["model/invariants.md"]},{"id":"A6","type":"artifact","title":"Scenario ledger","ezx":"A file of canonical stories, each with an ID, a tier, an origin saying whether it came from the field or was constructed, the story itself, and the concepts it exercises — plus a matrix showing which levels cover which story.","original":"Canonical stories with ID, tier (T1/T2), origin (`field` =\ndesign-partner-validated / `constructed`), prose, an *Exercises:* line (a\n`persona:` tag appears on S1 only), and a per-level coverage matrix filled as\nlevels are accepted. Instance: `model/scenario-ledger.md` (31 scenarios).","sources":["model/scenario-ledger.md"]},{"id":"A7","type":"artifact","title":"Vocabulary glossary","ezx":"One binding sentence per term, grouped by the level that owns it. That sentence is the canon shown in hover cards everywhere; any finer precision lives in the owning level's rules tables.","original":"One binding line per term, grouped by owning level with checked group anchors\n(`{#vocab-l0}`); \"the glossary line is canon: hover cards carry it everywhere,\nprecision beyond it lives in the owning level's contracts\". Instance:\n`model/vocabulary.md` (132 terms).","sources":["model/vocabulary.md"]},{"id":"A8","type":"artifact","title":"Traceability matrix","ezx":"A table mapping every item from the original design notes to where it ended up, under the rule that everything must have at least one destination — plus the status of the topic memos and the known open items.","original":"Every design-note item → destination(s) (levels, `method`, `build`,\n`assembly`, `done`) under the completeness rule, plus topic-memo status and\nknown-open-items tables. Instance: `model/traceability.md`.","sources":["model/traceability.md"]},{"id":"A9","type":"artifact","title":"Concept inventory","ezx":"The largest shared file: who the audience is, the reading spine, every core concept with its plain-language gloss and its slug (the key question-bank files and worked-example references join on), a dependency graph, the register of domain assumptions, the known simplification traps, and the per-level split of concepts.","original":"The largest shared asset: audience table, 9-chapter reading spine, the\ncore-concept inventory with tour glosses and the slug rule (the join key for\nquestion-bank filenames and worked-example references — worked examples\nthemselves are keyed `examples/S<id>.md`, `model/STRUCTURE.md`; 2026-07-27 arm\nfinding #5), dependency graph, §5 DA register (`ID | Claim | Source | Label`),\n§6 simplification traps, §9 per-level projection (owners `L0–L6 | spine | =\nalias`), change log. Instance: `model/spine/concept-inventory.md`;\nshared-write under trigger-holder-folds (`model/STRUCTURE.md` ownership\ntable).","sources":["model/spine/concept-inventory.md","model/STRUCTURE.md ownership table"]},{"id":"A10","type":"artifact","title":"Question-bank concept file","ezx":"One file per core concept holds the comprehension questions: the prompt, what a passing answer must contain, the misunderstanding it is built to catch, and the chapter from which it becomes answerable. Question IDs never change once minted; retired ones are marked, not deleted.","original":"One file per core concept keyed by inventory slug; per question: prompt, pass\nmarkers, detects (the trap it catches), and an `Answerable-from: ch<N>` tag;\nids `<slug>-Q<n>` stable once minted, retire by marking. Instances:\n`model/spine/question-bank/*.md` (59 files); content rules in\n`model/spine/question-bank/README.md`.","sources":["model/spine/question-bank/*.md (59 files)","model/spine/question-bank/README.md"]},{"id":"A11","type":"artifact","title":"Write-once worked example `examples/S<id>.md`","ezx":"A worked example lives in exactly one file, keyed by the story it illustrates, and the build pulls it into both a level page and a tour chapter — it is never copied. Its own header states the rules for writing it.","original":"Keyed by scenario id, transcluded by the build into both a level concept page\nand a tour chapter, never copied; content rules embedded as a header comment\n(\"the body must read inside a host page: headings start at H2, no process\nmetadata\"). Instance: `model/spine/examples/S13.md`.","sources":["model/spine/examples/S13.md"]},{"id":"A12","type":"artifact","title":"The debt map","ezx":"A ledger of leftover obligations: a legend of the allowed verdicts and their required detail tokens, a pinned inventory of its sources including row counts and a fingerprint, and rows whose item text must appear word-for-word in the frozen original.","original":"Front-mattered obligation ledger: a Dispositions legend with required\ndetail-prefix tokens, a pinned source inventory (row counts + a sha256 of the\nPC0 paragraph), and mapping rows whose `item` cell must be a verbatim\nsubstring of the frozen source. Instance: `model/c2/debt-map.md` (71 rows + 4\ntopic-memo fates).","sources":["model/c2/debt-map.md"]},{"id":"A13","type":"artifact","title":"Tour chapter","ezx":"A tour chapter opens with front matter naming its sources, tells the story of its concepts, offers three depth tiers, and closes with a validation block listing the claims still awaiting a human to confirm them, least-confirmed first.","original":"Front matter with an inline basis-register string; story-spine body over the\nchapter's core concepts; three depth tiers (core / in-passing prose /\n`<details>` under-the-hood); a chapter-end validation block (`Claim |\nValidation status | For | The question on the table`) ordered\nnon-field-validated-first. Instances: `model/onboarding/tour/ch0…ch9-*.md`\nwith committed `.html` siblings.","sources":["model/onboarding/tour/ch0…ch9-*.md"]},{"id":"A14","type":"artifact","title":"Generated views: the corpus ledger and the HTML renders","ezx":"Machine-generated files carry a do-not-edit banner and are still committed; a check guarantees they match a fresh build byte for byte. Sections with no data source yet are explicit skeletons naming what will feed them, rather than faking emptiness or completeness.","original":"Both carry a \"GENERATED … do not edit by hand\" banner and are committed;\nfreshness is guarded by the reproducibility check; ledger sections without\nfeeders are explicit skeletons naming their feeder — the artifact-side twin of\nthe check suite's \"never fake-green, never fake-red\" discipline (that phrase\nis `scripts/check.mjs`'s header). Instances: `model/ledger.md`,\n`model/c2/L0/*.html`, `model/onboarding/tour/ch*.html`.","sources":["model/ledger.md","model/c2/L0/*.html","model/onboarding/tour/ch*.html","scripts/check.mjs"]},{"id":"A15","type":"artifact","title":"Retro report and owner decision record","ezx":"A retrospective report states its own lens up front and backs every finding with an exhibit. The decision record that follows states the decision in the present tense, says why this and not that, and cites the report behind each condensed finding.","original":"Retro form: a self-describing lens header (blinded on reports 1–3) +\nexhibit-backed findings per consumer; decision form: Status/Scope/Evidence\nheader, the decision in the present, why-this-not-that, condensed findings\neach citing its report. Instances:\n`model-c1/retro/2026-07-13-report-1..6-*.md`,\n`model-c1/retro/2026-07-13-reset-decision.md`.","sources":["model-c1/retro/2026-07-13-report-1..6-*.md","model-c1/retro/2026-07-13-reset-decision.md"]},{"id":"A16","type":"artifact","title":"The loop map","ezx":"A single diagram of the system's spine, written once and rendered into more than one page. Its header declares status, role, medium, and source, and the choice of medium carries a built-in condition for switching to a hand-drawn version.","original":"The second write-once/rendered-twice spine asset beside the worked examples: a\nmermaid system-spine diagram with a header declaring `Status / Role / Medium /\nSource` — the medium owner-settled with an embedded revisit trigger (\"escalate\nto hand-authored SVG only if the first render misses the visual-spine bar\") —\nplus a framing-claim block citing INV-R1/R3/R9; transcluded into tour Ch0 and\nnamed by decision #7 as \"the concept layer's spine diagram, the first shared\nR0/R1 artifact\". Instance: `model/spine/loop-map.md`.","sources":["model/spine/loop-map.md","model/PROCESS2.md decision #7"]},{"id":"A17","type":"artifact","title":"The session scratchpad","ezx":"The process requires that each outside-review round's prompt and output be kept in the session scratchpad, and the records assert that they were. But no location, naming, or retention convention exists anywhere, and nothing of it is in the repository — mandated evidence with no visible surface.","original":"Arm prompt + output are required \"in the session scratchpad\"\n(`model/PROCESS2.md` §Review regime; the cycle-1 ancestor spells out \"(outside\nthe repo)\", `model-c1/PROCESS.md` §External review arm). The L0 round-1 record\nasserts it explicitly and rounds 2–5 inherit it via \"same pin and regime\"\n(`model/c2/L0/_meta.md`) — but no location, naming, or retention convention\nexists anywhere, and no artifact is in the repo. Reclassified from\nUnclassified (U3) per the 2026-07-27 arm round (finding #11): repository\nresidence is not a taxonomy criterion — this is the artifact-form the arm\nregime produces and consumes, its location/retention convention **practiced,\nnot recorded**.","sources":["model/PROCESS2.md §Review regime","model-c1/PROCESS.md §External review arm","model/c2/L0/_meta.md"],"flags":["practiced, not recorded"]},{"id":"G1","type":"gate","title":"Referential-integrity check","ezx":"Every reference to an invariant, absence, scenario, or assumption ID must actually resolve in the file that owns it. A dangling reference is a hard error; a definition nobody references only warns.","original":"Every `INV-*`/`ABS-*`/`S<n>`/`DA-<n>` reference on the live surface must\nresolve in its authority file; dangling ids are errors, orphan definitions\nwarn. `scripts/check.mjs` (`referentialIntegrity()`, lines 78–123).","gateClass":"machine","sources":["scripts/check.mjs (referentialIntegrity(), lines 78–123)"]},{"id":"G2","type":"gate","title":"Anchor-integrity check","ezx":"Section anchors must be unique across the whole corpus, and every link-style citation must point at one that exists. When a level is later split, this check turns each stale citation into an error with a list of the places to fix.","original":"Heading anchors `{#id}` are globally unique; every link-form citation must\nresolve — a future level split \"turns every stale citation into this check's\nerror with a site list\". `scripts/check.mjs` (`anchorIntegrity()`, lines\n136–161).","gateClass":"machine","sources":["scripts/check.mjs (anchorIntegrity(), lines 136–161)"]},{"id":"G3","type":"gate","title":"Authority-direction check","ezx":"The four foundation files may not cite a level's section — references only flow one way. On its very first run it caught a real violation carried over from the first cycle.","original":"The four foundation files may contain no `L<n> §<m>` level-section citation;\nit caught the live cycle-1 exhibit (INV-K6 → \"L3 §2.2\") on its first run.\n`scripts/check.mjs` (`authorityDirection()`, lines 165–178); rule in\n`model/PROCESS2.md` principle #6.","gateClass":"machine","sources":["scripts/check.mjs (authorityDirection(), lines 165–178)","model/PROCESS2.md principle #6"]},{"id":"G4","type":"gate","title":"Slug-bijection check","ezx":"Every question-bank file's slug must match a real concept in the inventory, be unique, and agree with the slug written inside the file itself.","original":"Every question-bank file's slug must resolve to an inventory-§3 concept, be\nunique, and match its own `Slug:` header. `scripts/check.mjs`\n(`slugBijection()`, lines 202–221).","gateClass":"machine","sources":["scripts/check.mjs (slugBijection(), lines 202–221)"]},{"id":"G5","type":"gate","title":"Per-level concept-budget check","ezx":"The mapping between the inventory's per-level split and the levels themselves must be exact — mismatches are hard errors. Going over the concept budget is only a warning that opens a split-or-demote-or-accept discussion; one level is currently over it.","original":"§9-projection bijection failures are errors; budget breaches (outside 5–9, L6\nfloor-exempt) are warnings that open a split/demote/accept-with-note\ndiscussion — \"mandatory check, advisory outcome\" (the review regime's\nsize-trigger bullet; operating mode fixed by decision #6). `scripts/check.mjs`\n(`conceptBudget()`, lines 273–317); currently warning on L4 (17 > 9).","gateClass":"machine","sources":["scripts/check.mjs (conceptBudget(), lines 273–317)","model/PROCESS2.md §Review regime (size-trigger bullet)","model/PROCESS2.md decision #6"],"flags":["machine-enforced for integrity, advisory for the budget"]},{"id":"G6","type":"gate","title":"Reproducibility check","ezx":"Every committed HTML page must be byte-for-byte identical to what a fresh build produces in memory; a rendered page whose source is gone is an error.","original":"Every committed render must byte-equal a fresh in-memory build (the build\nexports `generateArtifacts()` without writing precisely to enable this);\norphan renders are errors. `scripts/check.mjs` (`reproducibility()`, lines\n321–343).","gateClass":"machine","sources":["scripts/check.mjs (reproducibility(), lines 321–343)"]},{"id":"G7","type":"gate","title":"Debt-coverage check","ezx":"The debt map is checked both ways against the frozen originals: the sources are re-parsed at every run, the pinned paragraph is verified by fingerprint and row count, each item's text must appear word-for-word in the original, and every verdict token and memo fate must line up.","original":"Bidirectional coverage of the debt map against re-derived frozen sources: §9\nitems re-parsed from the frozen HTML at every run, the PC0 paragraph pinned by\nsha256 and row count, item cells verified as verbatim substrings, disposition\ntokens validated, topic-memo fate bijection. `scripts/check.mjs`\n(`debtCoverage()`, lines 378–479).","gateClass":"machine","sources":["scripts/check.mjs (debtCoverage(), lines 378–479)"]},{"id":"G8","type":"gate","title":"Structural-conformance + size triggers","ezx":"Front-matter versus directory agreement, the list of allowed inline HTML tags, and the file-size triggers all produce warnings only and can never fail the run; resolving them is an owner discussion. The charter claims this check enforces placement, but no placement check exists in the code — placement is kept by procedure today.","original":"Front-matter level ↔ directory conformance, the inline-HTML allowlist\n(DECISION / `<details>` / `<summary>`), and the KB size triggers (concept 25\nKB, protocol 15 KB, level 100 KB) all emit warnings; resolution is an owner\ndiscussion per decision #6. `scripts/check.mjs` (`structuralAndSize()`, lines\n227–265). Note: `model/STRUCTURE.md` says \"the structural-conformance check\nenforces placement\", but no placement check exists in code — placement is\nprocedure-enforced today.","gateClass":"machine","sources":["scripts/check.mjs (structuralAndSize(), lines 227–265)","model/STRUCTURE.md"],"flags":["machine-run, advisory only — cannot fail the run"]},{"id":"G9","type":"gate","title":"Declared skeleton checks","ezx":"Four checks are named but not written yet — label completeness, coverage assertions, amendment integrity, and traceability coverage. They report \"todo\" and contribute nothing to the exit code; of the four rules, only label completeness has a hand-kept interim check on record.","original":"Label completeness, coverage assertions, amendment integrity, traceability\ncoverage are named checks that currently report `todo` (\"c2 level surface\nexists — implement (R1+)\") and contribute nothing to the exit code; interim\nprocedure enforcement is on record for label completeness only (L0's \"label\ncompleteness (self-check)\" table in `model/c2/L0/_meta.md`) — the other three\nhave no interim keeper recorded (2026-07-27 arm finding #7).\n`scripts/check.mjs` (`skeletons()`, lines 483–492).","gateClass":"procedure","sources":["scripts/check.mjs (skeletons(), lines 483–492)","model/c2/L0/_meta.md"],"flags":["declared, not implemented"]},{"id":"G10","type":"gate","title":"The R1 level acceptance gate","ezx":"A level is accepted only when three legs pass: a fresh reader answers the quiz correctly, a cited table shows the level can express the canonical stories, and every rule row carries its knowledge label.","original":"Three legs: fresh-reader pass (notes-blind arm on the shared bank), scenario\nexpressibility (a cited claims table), label completeness. Defined in\n`model/PROCESS2.md` §Phases R1 (\"Gate: fresh-reader + scenario expressibility\n+ label completeness\"); executed in `model/c2/L0/_meta.md` (five consecutive\n11/11 runs; 11-row expressibility table; 20/20 labeled rows).","gateClass":"procedure","sources":["model/PROCESS2.md §Phases R1","model/c2/L0/_meta.md"]},{"id":"G11","type":"gate","title":"Owner ratification / the Felho checkpoint","ezx":"The owner personally closes every acceptance on both tracks. It is recorded in the file's status line and in its own commit, and by definition it cannot be automated.","original":"The single identity-bound act closing every acceptance on both tracks;\nrecorded in status lines (`status: accepted (Felho, 2026-07-14)`) and its own\ncommits. `model/STRUCTURE.md` §Operational layer;\n`model/onboarding/onboarding-process.md` method step 3.","gateClass":"procedure","sources":["model/STRUCTURE.md §Operational layer","model/onboarding/onboarding-process.md method step 3"],"flags":["un-automatable by definition"]},{"id":"G12","type":"gate","title":"The stopping rule","ezx":"The review rounds end once two rounds in a row produce at most two accepted conceptual findings. The tally is kept by hand, and the owner may close earlier in a sanctioned way.","original":"Two consecutive rounds with ≤2 accepted conceptual findings close the arm\nphase; hand-tallied; the owner may close earlier under decision #4's\nsanctioned form (L0 closed on owner judgment at 5, 3, 3, 3, 2).\n`model/PROCESS2.md` §Review regime; record in `model/c2/L0/_meta.md`.","gateClass":"procedure","sources":["model/PROCESS2.md §Review regime","model/c2/L0/_meta.md"]},{"id":"G13","type":"gate","title":"The cadence guard","ezx":"Closing the review and accepting the work in the same sitting draws a warning addressed to the owner, and a missing per-section reading log warns but never blocks. No code implements it — it exists purely as owner discipline.","original":"A same-sitting arm-close + acceptance draws a warning addressed to the owner;\nthe per-section read-log is default gate evidence whose absence warns, never\nblocks. Defined in `model/PROCESS2.md` decision #4 as \"the check flags…\", but\nno code implements it — it exists purely as owner discipline (L0 satisfied it\nby a separate-sitting owner read, `model/c2/L0/_meta.md` gate record).","gateClass":"procedure","sources":["model/PROCESS2.md decision #4","model/c2/L0/_meta.md gate record"]},{"id":"G14","type":"gate","title":"Arm-mechanics guard: clean tree + byte-guard + hash-citing verdict","ezx":"The outside reviewer may only run against a committed tree, the reviewed bytes are fingerprinted before and after, and a verdict that does not quote those fingerprints does not count. No script computes any of it.","original":"The review arm may only run on a committed tree; reviewed bytes are\nhash-guarded before/after; a verdict must cite the basis hashes or it is no\nverdict. `model/PROCESS2.md` §Review regime; per-round evidence (sha256 pairs)\nin `model/c2/L0/_meta.md`. No script computes these hashes.","gateClass":"procedure","sources":["model/PROCESS2.md §Review regime","model/c2/L0/_meta.md"]},{"id":"G15","type":"gate","title":"Prerequisite-promotion guard","ezx":"A later core concept may never lean on something the tour only mentioned in passing; the moment drafting hits that, the mention must be promoted to a full core treatment. The inventory calls it the one rule that binds the two concept tiers.","original":"Standing consistency guard on the tour track: a later core concept never\npresupposes an in-passing mention — \"promote if drafting hits it\"\n(`model/onboarding/onboarding-process.md` §Method step 4). The concept\ninventory states it as the one rule binding the core and in-passing tiers: \"a\nlater core concept may not presuppose something that was only mentioned in\npassing — if drafting hits that, the passing mention promotes\".\nProcedure-enforced during drafting; no script checks it. Entered the ledger\nfrom the 2026-07-27 arm round (finding #8, missing-element) — the extraction\nrun had not surfaced it.","gateClass":"procedure","sources":["model/onboarding/onboarding-process.md §Method step 4 (Standing consistency guards)","model/spine/concept-inventory.md (\"One rule binds the two tiers\")"]},{"id":"U1","type":"unclassified","title":"The frozen quarry `model-c1/`","ezx":"The whole first-cycle tree, kept frozen. It is at once a source to harvest from, an archive, and something the checks read — but nobody may write to it, so it has no owner and no checkpoint. It is a state with an ownership profile rather than a rule, a procedure, a document form, or a control.","original":"Simultaneously an input (R3 harvest), an archive (frozen renders, retro,\ntopics), and a check source (G7 reads it); it has no writer and therefore no\ngate (\"`model-c1/` | none — frozen | R3 quarry harvest, coverage checks |\nexempt from the checked scan surface\", `model/STRUCTURE.md` ownership table;\n\"a quarry, NOT a base\", `model/PROCESS2.md` Inputs). It resists the taxonomy\nbecause it is a *state with an ownership profile* — not a rule, not a\nprocedure, not a form the process produces, not a control.","sources":["model/STRUCTURE.md ownership table","model/PROCESS2.md Inputs"]},{"id":"U2","type":"unclassified","title":"Off-repo inputs and their index","ezx":"Much of the material the corpus rests on lives outside the repository — a shared drive of vision documents, research reports, and field notes, plus a few local snapshots and an annotated index of that drive. No check can see any of it, the entire \"confirmed in the field\" label depends on it, and the index file belongs to neither track's ownership table.","original":"The Google Drive corpus (vision doc, research reports, field-call\nnotes), the local snapshots at the repo root\n(`architecture-design-notes.md`,\n`architecture-build-plan.html`, `design-partner-discovery-guide.html`,\ntwo PDFs), and `INDEX.md` (an annotated index *of the Drive folder* carrying\nteam and business context — not alone in that: the concept inventory's\naudience table holds team roles and validation lenses, and the design-notes\nsnapshot records operating roles and business implications; 2026-07-27 arm\nfinding #6). The entire `field-validated` epistemic label rests on artifacts\nno check can see, and `INDEX.md` sits outside both tracks' ownership tables —\nconsumed by the process but governed by nothing in it, which is why it fits no\ntype.","sources":["INDEX.md","architecture-design-notes.md","architecture-build-plan.html","design-partner-discovery-guide.html"]},{"id":"U4","type":"unclassified","title":"Blinded multi-subagent retrospective feeding an owner decision","ezx":"Six independent AI reports — three deliberately kept from seeing each other's conclusions, three analysing an outside reference process — fed one owner decision that produced the current process constitution. It happened once and is written down nowhere as a repeatable procedure, so it fits none of the four types — yet it produced the constitution itself.","original":"Six independent retro reports fed one owner reset decision that produced\nPROCESS2 itself: reports 1–3 carry the blinded header \"run WITHOUT access to\nthe structure-retro session's conclusions (bias-free by construction)\";\nreports 4–6 are independent subagent analyses of an external reference process\n(pairflow) — report 6 the comparison proper — two of them carrying post-hoc\nowner corrections in their headers. Exists as a recorded instance\n(`model-c1/retro/2026-07-13-report-1..6-*.md`,\n`model-c1/retro/2026-07-13-reset-decision.md`) but is defined nowhere as a\nrepeatable procedure. Reclassified from Mechanism (M12) per the 2026-07-27 arm\nround (finding #12): a single dated instance, explicitly not defined as\nrepeatable, falls below the Mechanism bar's \"recurring\" — but it is too\nload-bearing to drop, so it sits here as a one-off.","sources":["model-c1/retro/2026-07-13-report-1..6-*.md","model-c1/retro/2026-07-13-reset-decision.md"],"flags":["practiced, not recorded"]}],"coreThree":[{"rank":1,"title":"P1 — Sessions are ephemeral; the repo is the institution","ezx":"Every other piece of this process follows from taking one fact seriously: no work session remembers anything, so the repository has to carry it all. Strip everything else away and a process that still obeys this can regrow its machinery; drop it and no amount of remaining machinery survives the next session boundary.","itemIds":["P1"]},{"rank":2,"title":"M1 — The external review-arm regime","ezx":"This is the only force in the loop that subtracts rather than adds — the first cycle const $ = (sel, root) => (root || document).querySelector(sel);
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null) continue;
    if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null) continue;
    el.append(c.nodeType ? c : document.createTextNode(c));
  }
  return el;
}
const SVGNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, ...children) {

  for (const c of children.flat()) if (c != null) el.append(c.nodeType ? c : document.createTextNode(c));

}
function esc(str) {
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
/* minimal inline markdown: paragraphs, `code`, **bold**, *em* */
function md(str) {
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
  return String(str).trim().split(/\n{2,}/)
    .map(p => "<p>" + inline(p) + "</p>").join("");
}

}

app.append(h("div", { class: "wrap hero" },
  h("div", { class: "eyebrow" }, DATA.kind === "ledger" ? "Process ledger · present state" : "Process self-report · present state"),
  h("h1", null, DATA.project),
  h("div", { class: "hero-sub" },
    DATA.reportDate + (DATA.repoHead ? " · HEAD " + DATA.repoHead : "") +
    (DATA.kind === "ledger" ? " · curated ledger of the project's process" : " · the project describing its own process, from the inside")),
  summaryDiv,
  DATA.scopeNote ? h("div", { class: "scope-note" }, "Scope: " + DATA.scopeNote) : null,
  h("div", { class: "tiles" },
    TILE_ORDER.filter(t => counts[t]).map(t =>
      h("a", { class: "tile" + (t === "unclassified" ? " small" : ""), href: "#sec-" + t, style: "--tc:" + TYPES[t].css },
        h("div", { class: "n" }, String(counts[t])),
        h("div", { class: "l" }, TYPES[t].label)))),
  verifChip));

/* ---------- core three ---------- */
if ((DATA.coreThree || []).length) {
  app.append(h("section", { id: "core", class: "wrap" },
    h("h2", null, "If everything else were stripped away"),
    h("p", { class: "sec-desc" },
      "The report's own priority ranking: forced to radically simplify, these are the elements the process would defend last."),
    h("div", { class: "core-grid" },
      DATA.coreThree.map(c => {
        const p = h("p", null); p.innerHTML = md(c.ezx);
        return h("div", { class: "core-card" },
          h("div", { class: "core-rank" }, "DEFENDED #" + c.rank),
          h("h3", null, c.title),
          p,
          h("div", { class: "member-chips" }, (c.itemIds || []).map(id => chip(id))));
      }))));
}

/* ---------- relations map ---------- */
const mapItems = DATA.items.filter(it => COL_ORDER.includes(it.type));
if (edges.length && mapItems.length) {
  const NODE_H = 30, VGAP = 9, PAD = 16, HEAD_H = 30, LINE_H = 14, INFO_W = 22;
  const COMPACT = { nodeW: 176, colGap: 104, wrap: false };
  const cols = COL_ORDER.filter(t => mapItems.some(it => it.type === t));
  const colItems = new Map(cols.map(t => [t, mapItems.filter(i => i.type === t)]));

  /* text metrics — the map sizes its boxes to the text it actually draws */
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const ctx2d = (() => { try { return document.createElement("canvas").getContext("2d"); } catch (_) { return null; } })();
  const FONT_TITLE = "11px " + (cssVar("--sans") || "sans-serif");
  const FONT_ID = "700 11px " + (cssVar("--mono") || "monospace");
  function textW(str, font) {
    if (!ctx2d) return String(str).length * 6.2;
    ctx2d.font = font;
    return ctx2d.measureText(str).width;
  }
  function fit(str, font, max) {
    if (textW(str, font) <= max) return str;
    let t = String(str);
    while (t.length > 1 && textW(t + "…", font) > max) t = t.slice(0, -1);
    return t.trimEnd() + "…";
  }
  function wrapTitle(str, max) {
    const out = [];
    let cur = "";
    for (const w of String(str).split(/\s+/)) {
      const next = cur ? cur + " " + w : w;
      if (cur && textW(next, FONT_TITLE) > max) { out.push(cur); cur = w; } else cur = next;
    }
    if (cur) out.push(cur);
    return out.map(l => fit(l, FONT_TITLE, max));
  }
  const TITLE_X = 9 + Math.ceil(Math.max(...mapItems.map(it => textW(it.id, FONT_ID)))) + 8;
  const TITLE_W_MAX = Math.max(...mapItems.map(it => textW(it.title, FONT_TITLE)));

  const svg = s("svg", { id: "map", role: "img", "aria-label": "Relation map between the process elements" });
  const info = h("div", { id: "mapInfo", role: "status" });
  const tip = h("div", { id: "mapTip", role: "tooltip" });
  document.body.append(tip);

  const hiddenTypes = new Set();
  let geo = COMPACT, pos = new Map(), edgeEls = [], selected = null, expanded = false;

  /* ---- render (re-run whenever the geometry changes) ---- */
  function render() {
    const nodeW = geo.nodeW, colGap = geo.colGap;
    const titleW = nodeW - TITLE_X - INFO_W - 8;
    const colX = new Map(cols.map((t, i) => [t, PAD + i * (nodeW + colGap)]));
    const lines = new Map();
    pos = new Map();
    edgeEls = [];
    let maxY = 0;
    for (const t of cols) {
      let y = PAD + HEAD_H;
      for (const it of colItems.get(t)) {
        const ls = geo.wrap ? wrapTitle(it.title, titleW) : [fit(it.title, FONT_TITLE, titleW)];
        const hh = Math.max(NODE_H, ls.length * LINE_H + 14);
        lines.set(it.id, ls);
        pos.set(it.id, { x: colX.get(t), y, h: hh });
        y += hh + VGAP;
      }
      maxY = Math.max(maxY, y);
    }
    const W = PAD * 2 + cols.length * nodeW + (cols.length - 1) * colGap;
    const HGT = maxY + PAD;

    svg.replaceChildren();
    svg.setAttribute("viewBox", "0 0 " + W + " " + HGT);
    svg.setAttribute("width", W);
    svg.setAttribute("height", HGT);

    for (const t of cols) {
      svg.append(s("text", { class: "colhead", x: colX.get(t) + nodeW / 2, y: PAD + 12, "text-anchor": "middle" },
        TYPES[t].label + " (" + counts[t] + ")"));
    }

    edges.forEach((e, i) => {
      if (hiddenTypes.has(e.type)) return;
      const a = pos.get(e.from), b = pos.get(e.to);
      if (!a || !b) return;
      const st = EDGE_STYLES[e.type] || EDGE_STYLES["part-of"];
      let d;
      const ay = a.y + a.h / 2, by = b.y + b.h / 2;
      if (a.x === b.x) {
        const x = a.x + nodeW, bulge = 34 + 16 * (i % 3);
        d = "M" + x + " " + ay + " C" + (x + bulge) + " " + ay + " " + (x + bulge) + " " + by + " " + x + " " + by;
      } else {
        const goRight = a.x < b.x;
        const x1 = goRight ? a.x + nodeW : a.x, x2 = goRight ? b.x : b.x + nodeW;
        const dx = Math.abs(x2 - x1) * 0.45 * (goRight ? 1 : -1);
        d = "M" + x1 + " " + ay + " C" + (x1 + dx) + " " + ay + " " + (x2 - dx) + " " + by + " " + x2 + " " + by;
      }
      const p = s("path", { class: "edge", d, "stroke-width": st.width, "data-type": e.type, "data-from": e.from, "data-to": e.to },
        s("title", null, e.from + " " + st.label.replace(/ $/, "") + " " + e.to + (e.note ? " — " + e.note : "")));
      if (st.dash) p.setAttribute("stroke-dasharray", st.dash);
      edgeEls.push(p);
      svg.append(p);
    });

    for (const it of mapItems) {
      const { x, y, h: hh } = pos.get(it.id);
      const ls = lines.get(it.id);
      const base = y + (hh - ls.length * LINE_H) / 2 + 11;
      const g = s("g", { class: "node", "data-id": it.id, tabindex: "0", role: "button", "aria-label": it.id + " — " + it.title });
      g.append(s("rect", { x, y, width: nodeW, height: hh, rx: 6, fill: TYPES[it.type].css, "fill-opacity": "0.16", stroke: TYPES[it.type].css, "stroke-width": "1.25" }));
      /* the native title bubble only repeats what a truncated node hides — expanded nodes show it already */
      if (!expanded) g.append(s("title", null, it.id + " — " + it.title));
      g.append(
        s("text", { x: x + 9, y: base, "font-weight": "700" }, it.id),
        s("text", { class: "nt", x: x + TITLE_X, y: base },
          ls.map((l, i) => s("tspan", { x: x + TITLE_X, y: base + i * LINE_H }, l))));
      g.append(s("g", { class: "node-info", "data-id": it.id, "aria-hidden": "true" },
        s("circle", { cx: x + nodeW - 14, cy: y + 15, r: 7 }),
        s("text", { x: x + nodeW - 14, y: y + 18.5, "text-anchor": "middle" }, "i")));
      svg.append(g);
    }

    if (selected && byId.has(selected)) highlight(selected); else svg.classList.remove("has-sel");
  }

  /* ---- selection ---- */
  function highlight(id) {
    svg.querySelectorAll(".on").forEach(el => el.classList.remove("on"));
    svg.classList.add("has-sel");
    const linked = new Set([id]);
    for (const p of edgeEls) {
      if (p.dataset.from === id || p.dataset.to === id) {
        p.classList.add("on");
        linked.add(p.dataset.from); linked.add(p.dataset.to);
      }
    }
    svg.querySelectorAll(".node").forEach(n => { if (linked.has(n.dataset.id)) n.classList.add("on"); });
  }
  function clearSel() {
    selected = null;
    svg.classList.remove("has-sel");
    svg.querySelectorAll(".on").forEach(el => el.classList.remove("on"));
    info.classList.remove("show");
  }
  function selectNode(id) {
    selected = id;
    highlight(id);
    const it = byId.get(id);
    info.replaceChildren(
      h("h4", null, chip(id), " ", it.title),
      (() => { const p = h("p", null); p.innerHTML = md(it.ezx); return p; })(),
      h("a", { href: "#card-" + id, onclick: e => { e.preventDefault(); openCard(id); } }, "Open the full card ↓"));
    info.classList.add("show");
  }

  /* ---- hover card on the info dot ---- */
  const TIP_DELAY = 450;
  let tipTimer = null, tipHideTimer = null, tipFor = null;
  function showTip(id, anchor) {
    const it = byId.get(id);
    if (!it) return;
    const body = h("div", null);
    body.innerHTML = md(it.ezx);
    tip.replaceChildren(h("h4", null, it.id + " — " + it.title), body);
    tip.classList.add("show");
    tipFor = id;
    const r = anchor.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = r.right + 12;
    if (left + tw > window.innerWidth - 10) left = r.left - tw - 12;
    if (left < 10) left = Math.max(10, (window.innerWidth - tw) / 2);
    const top = Math.min(Math.max(10, r.top + r.height / 2 - th / 2), Math.max(10, window.innerHeight - th - 10));
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  }
  function hideTip() {
    clearTimeout(tipTimer);
    tip.classList.remove("show");
    tipFor = null;
  }
  svg.addEventListener("mouseover", e => {
    const ic = e.target.closest(".node-info");
    if (!ic) return;
    clearTimeout(tipHideTimer);
    if (tipFor === ic.dataset.id) return;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => showTip(ic.dataset.id, ic), TIP_DELAY);
  });
  svg.addEventListener("mouseout", e => {
    if (!e.target.closest(".node-info")) return;
    clearTimeout(tipTimer);
    tipHideTimer = setTimeout(hideTip, 180);
  });
  tip.addEventListener("mouseenter", () => clearTimeout(tipHideTimer));
  tip.addEventListener("mouseleave", () => { tipHideTimer = setTimeout(hideTip, 120); });

  svg.addEventListener("click", e => {
    const ic = e.target.closest(".node-info");
    const g = e.target.closest(".node");
    if (ic) { clearTimeout(tipTimer); showTip(ic.dataset.id, ic); }
    if (g) selectNode(g.dataset.id); else clearSel();
  });
  svg.addEventListener("keydown", e => {
    const g = e.target.closest(".node");
    if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); selectNode(g.dataset.id); }
  });

  /* ---- edge-type toggles ---- */
  const usedTypes = [...new Set(edges.map(e => e.type))];
  const toggles = usedTypes.map(t => {
    const st = EDGE_STYLES[t];
    const sample = s("svg", { width: 26, height: 8, "aria-hidden": "true" },
      s("path", { d: "M1 4 H25", stroke: "currentColor", "stroke-width": st.width, "stroke-dasharray": st.dash || "none", fill: "none" }));
    return h("button", { class: "edge-toggle", "aria-pressed": "true", onclick: ev => {
      const btn = ev.currentTarget;
      const on = btn.getAttribute("aria-pressed") !== "true";
      btn.setAttribute("aria-pressed", String(on));
      if (on) hiddenTypes.delete(t); else hiddenTypes.add(t);
      clearSel();
      render();
    } }, sample, st.label, " (" + edges.filter(e => e.type === t).length + ")");
  });

  /* ---- expand / collapse ---- */
  function cornerIcon(collapse) {
    const d = collapse
      ? "M9 3v6H3 M15 3v6h6 M15 21v-6h6 M9 21v-6H3"
      : "M3 9V3h6 M15 3h6v6 M21 15v6h-6 M9 21H3v-6";
    return s("svg", { width: 15, height: 15, viewBox: "0 0 24 24", fill: "none", "aria-hidden": "true" },
      s("path", { d, stroke: "currentColor", "stroke-width": "2", "stroke-linecap": "round", "stroke-linejoin": "round" }));
  }
  const expandBtn = h("button", { class: "map-expand", type: "button", "aria-label": "Expand the map", title: "Expand the map" }, cornerIcon(false));
  const scrollBox = h("div", { class: "map-scroll" }, svg);
  const mapBox = h("div", { class: "map-box" }, expandBtn, scrollBox);
  const mapWrap = h("div", { class: "map-wrap" },
    h("div", { class: "map-controls" }, toggles, h("span", { class: "map-hint" }, "click a node · hover ⓘ for the description · Esc to clear")),
    mapBox, info);
  const backdrop = h("div", { class: "map-backdrop", onclick: () => setExpanded(false) });

  function geoFor(boxW) {
    const avail = Math.max(360, boxW - 22);
    const gapMin = 70;
    const fitW = Math.floor((avail - PAD * 2 - (cols.length - 1) * gapMin) / cols.length);
    const nodeW = Math.max(COMPACT.nodeW, Math.min(fitW, Math.ceil(TITLE_X + TITLE_W_MAX + INFO_W + 10)));
    const gap = Math.max(gapMin, Math.min(240, Math.floor((avail - PAD * 2 - cols.length * nodeW) / (cols.length - 1))));
    return { nodeW, colGap: gap, wrap: true };
  }
  function relayout() {
    if (!expanded) { geo = COMPACT; render(); return; }
    const boxW = scrollBox.clientWidth;
    geo = geoFor(boxW);
    render();
    /* a scrollbar may have appeared during that render — re-fit once against the real width */
    if (scrollBox.clientWidth !== boxW) { geo = geoFor(scrollBox.clientWidth); render(); }
  }
  function setExpanded(on) {
    if (expanded === on) return;
    expanded = on;
    hideTip();
    mapWrap.classList.toggle("expanded", on);
    backdrop.classList.toggle("show", on);
    document.body.classList.toggle("map-open", on);
    expandBtn.replaceChildren(cornerIcon(on));
    expandBtn.setAttribute("aria-label", on ? "Collapse the map" : "Expand the map");
    expandBtn.setAttribute("title", on ? "Collapse the map (Esc)" : "Expand the map");
    requestAnimationFrame(relayout);
  }
  expandBtn.addEventListener("click", () => setExpanded(!expanded));
  scrollBox.addEventListener("scroll", hideTip);
  window.addEventListener("scroll", hideTip, { passive: true });
  let resizeTimer = null;
  window.addEventListener("resize", () => {
    if (!expanded) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(relayout, 120);
  });
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (tipFor) hideTip();
    else if (selected) clearSel();
    else if (expanded) setExpanded(false);
  });

  render();
  app.append(h("section", { id: "map-sec", class: "wrap" },
    h("h2", null, "How the pieces hold each other"),
    h("p", { class: "sec-desc" }, "Every line is a relation the report states explicitly. Gates enforce principles; procedures nest inside the main loop. Click an element to see what it is connected to — or expand the map for full titles."),
    mapWrap, backdrop));
}

/* ---------- item sections ---------- */
function relLine(verb, otherId) {
  const other = byId.get(otherId);
  return h("div", { class: "rel" },
    h("span", { class: "verb" }, verb + " "),
    h("a", { href: "#card-" + otherId, onclick: e => { e.preventDefault(); openCard(otherId); } },
      otherId + (other ? " — " + other.title : "")));
}
function itemCard(it) {
  const orig = h("div", { class: "orig" });
  orig.innerHTML = md(it.original);
  const rels = [
    ...(outEdges.get(it.id) || []).map(e => relLine(EDGE_VERBS[e.type][0], e.to)),
    ...(inEdges.get(it.id) || []).map(e => relLine(EDGE_VERBS[e.type][1], e.from))
  ];
  const ezx = h("p", { class: "ezx" }); ezx.innerHTML = md(it.ezx);
  return h("article", { class: "card", id: "card-" + it.id, "data-search": (it.id + " " + it.title + " " + it.ezx).toLowerCase() },
    h("div", { class: "card-head" },
      h("span", { class: "chip", style: "--cc:" + TYPES[it.type].css }, it.id),
      h("span", { class: "title" }, it.title),
      it.gateClass ? h("span", { class: "tag" }, it.gateClass + "-enforced") : null,
      (it.flags || []).map(f => h("span", { class: "tag" }, f))),
    ezx,
    h("details", null,
      h("summary", null, "Original text & sources"),
      orig,
      (it.sources || []).length ? h("ul", { class: "srcs" }, it.sources.map(src => h("li", null, src))) : null,
      rels.length ? h("div", { class: "rels" }, rels) : null));
}
for (const t of TILE_ORDER) {
  const items = DATA.items.filter(it => it.type === t);
  if (!items.length) continue;
  app.append(h("section", { id: "sec-" + t, class: "wrap" },
    h("h2", { style: "--hc:" + TYPES[t].css },
      h("span", { class: "dot", "aria-hidden": "true" }),
      TYPES[t].label,
      h("span", { class: "cnt" }, String(items.length))),
    h("p", { class: "sec-desc" }, TYPES[t].desc),
    h("div", { class: "card-grid" }, items.map(itemCard))));
}

/* ---------- retired ---------- */
if ((DATA.retired || []).length) {
  app.append(h("section", { id: "retired", class: "wrap" },
    h("h2", null, "Superseded along the way"),
    h("p", { class: "sec-desc" }, "The process retires its own rules with the same care it births them. What was replaced, and by what."),
    h("div", { class: "retired-list" },
      DATA.retired.map(r => h("div", { class: "retired-row" },
        h("span", { class: "old" }, r.old),
        h("span", { class: "arrow", "aria-hidden": "true" }, "→"),
        h("span", { class: "new" }, r.new),
        r.note ? h("span", { class: "note" }, r.note) : null)))));
}

/* ---------- verification ---------- */
if (DATA.verification) {
  const v = DATA.verification;
  app.append(h("section", { id: "verif", class: "wrap" },
    h("h2", null, "External verification"),
    h("p", { class: "sec-desc" },
      "A different vendor's model (" + v.arm + ") reviewed this report against the repository. Findings and their recorded dispositions:"),
    h("div", { class: "verif-head" }, h("span", { class: "verif-file" }, v.findingsFile)),
    h("div", null, v.findings.map(f =>
      h("div", { class: "finding" },
        h("span", { class: "disp", "data-d": f.disposition }, f.disposition),
        h("span", null, f.summary,
          (f.itemIds || []).length ? h("span", { class: "fchips" }, f.itemIds.map(id => chip(id))) : null))))));
}

/* ---------- footer ---------- */
app.append(h("footer", null, h("div", { class: "wrap" },
  h("div", { class: "prov" }, "Source: " + (DATA.sourcePath || "raw/_cross/self-reports/" + DATA.reportFile) + " · rendered " + DATA.generatedAt),
  h("div", null, "Descriptive only, like the report itself: the form is changed, the content is not."))));

/* ---------- text filter ---------- */
$("#q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".card").forEach(c => {
    c.style.display = !q || c.dataset.search.includes(q) ? "" : "none";
  });
});
</script>

</body>
</html>
